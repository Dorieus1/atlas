<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Atlas is an AI receptionist and CRM built for small businesses — customers, leads, and follow-ups, handled automatically." />
    <meta name="theme-color" content="#ea580c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atlas" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Atlas — AI Receptionist &amp; CRM</title>
    <script>
      // Runs synchronously before first paint, so a returning user who
      // picked light mode doesn't see a flash of the dark theme first -
      // ThemeContext's own effect (frontend/src/context/ThemeContext.jsx)
      // can't set data-theme until after React mounts, which is already
      // one or more paints too late. Mirrors that same file's read logic
      // exactly (only "light" is ever trusted; anything else, including
      // localStorage being unavailable, falls through to dark).
      try {
        if (localStorage.getItem("atlas_theme") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
